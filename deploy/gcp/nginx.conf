# Neorons website — nginx server block (Option A: VM hosting)
# Adjust `root` to wherever the repo is cloned. Pair with certbot for TLS;
# certbot will add the ssl_* lines and the HTTP->HTTPS redirect itself.

# www -> apex
server {
    listen 80;
    listen 443 ssl;
    server_name www.neorons.com;
    return 301 https://neorons.com$request_uri;
}

server {
    listen 80;
    server_name neorons.com;
    root /var/www/neorons;
    index index.html;

    # --- Security headers (mirror of vercel.json; keep in sync) -------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # img-src MUST allow *.basemaps.cartocdn.com or the Leaflet map serves no tiles.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https://*.basemaps.cartocdn.com; font-src 'self'; form-action 'self' https://formspree.io; frame-ancestors 'none'" always;
    # Enable HSTS only once HTTPS is confirmed working:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Caching ------------------------------------------------------------
    # Immutable assets: cache hard.
    location ~ ^/(fonts|vendor)/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    # HTML/CSS/JS: revalidate so content edits show up promptly.
    location ~ \.(html|css|js|xml|txt|webmanifest)$ {
        add_header Cache-Control "no-cache";
        # re-declare security headers: nginx add_header does not inherit
        # into blocks that declare their own
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https://*.basemaps.cartocdn.com; font-src 'self'; form-action 'self' https://formspree.io; frame-ancestors 'none'" always;
    }

    # --- Routing ------------------------------------------------------------
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve repo metadata or deploy config
    location ~ ^/(\.git|deploy|scripts)/ { return 404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
