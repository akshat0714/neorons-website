<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Neorons social image</title>
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #fcfaf6;
        color: #203a34;
        font-family: Georgia, serif;
        box-sizing: border-box;
        padding: 48px 65px;
      }
      .brand {
        font-size: 35px;
        letter-spacing: -1px;
        font-weight: bold;
      }
      .line {
        width: 70px;
        height: 4px;
        background: #a34b32;
        margin: 40px 0 28px;
      }
      h1 {
        font-size: 70px;
        font-weight: normal;
        line-height: 1.08;
        letter-spacing: -2px;
        margin: 0;
      }
      em {
        color: #a34b32;
        font-weight: normal;
      }
      p {
        font:
          20px Arial,
          sans-serif;
        color: #5c655f;
        margin: 30px 0;
      }
      .stats {
        position: absolute;
        top: 530px;
        left: 65px;
        right: 65px;
        border-top: 1px solid #d5d9ce;
        padding-top: 24px;
        font:
          19px Arial,
          sans-serif;
        color: #234c40;
      }
      .stats span {
        margin-right: 40px;
      }
      .domain {
        float: right;
      }
    </style>
  </head>
  <body>
    <div class="brand">◎ Neorons</div>
    <div class="line"></div>
    <h1>A world where no one<br />has to <em>struggle alone.</em></h1>
    <p>Suicide prevention. Across languages and borders.</p>
    <div class="stats">
      <span>500,000+ people</span><span>80+ countries</span
      ><span class="domain">neorons.com</span>
    </div>
  </body>
</html>
