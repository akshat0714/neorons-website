<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Neorons social preview</title>
    <style>
      @font-face {
        font-family: Archivo;
        src: url("../fonts/archivo-v25-latin-800.woff2");
        font-weight: 800;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #faf8f5;
        padding: 18px;
        color: #171816;
        font-family: Arial, sans-serif;
      }
      .art {
        background: #bdddeb url("paper-grain.svg");
        border-radius: 28px;
        height: 594px;
        position: relative;
        overflow: hidden;
        text-align: center;
        padding-top: 35px;
      }
      .brand {
        font-family: Archivo, Arial, sans-serif;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -1.5px;
      }
      h1 {
        font:
          400 70px/1.02 Georgia,
          serif;
        letter-spacing: -4px;
        margin: 32px 0 28px;
      }
      p {
        font-size: 16px;
      }
      .cards {
        display: flex;
        gap: 20px;
        justify-content: center;
        align-items: center;
        margin-top: 45px;
      }
      .card {
        padding: 22px 35px;
        width: 270px;
        background: #fffdf6;
        border-radius: 12px;
        box-shadow: 0 10px 20px #203a341c;
        transform: rotate(-4deg);
      }
      .card:nth-child(2) {
        background: #d9e5bb;
        transform: rotate(3deg);
        width: 240px;
      }
      .card:nth-child(3) {
        background: #e7ad94;
        transform: rotate(-3deg);
        width: 270px;
      }
      .card strong {
        display: block;
        font:
          400 44px/1.3 Georgia,
          serif;
        letter-spacing: -2px;
      }
      .card span {
        font-size: 12px;
      }
      .url {
        position: absolute;
        bottom: 18px;
        left: 0;
        right: 0;
        font-size: 11px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="art">
      <div class="brand">neorons</div>
      <h1>Suicide prevention,<br />without borders.</h1>
      <p>A nonprofit working internationally for suicide prevention.</p>
      <div class="cards">
        <div class="card">
          <strong>500,000+</strong><span>people reached</span>
        </div>
        <div class="card"><strong>80+</strong><span>countries</span></div>
        <div class="card">
          <strong>125,000</strong
          ><span>reached through our AI phone service</span>
        </div>
      </div>
      <span class="url">NEORONS.COM</span>
    </div>
  </body>
</html>
